#:schema node_modules/wrangler/config-schema.json
name = "bolt-replit"
main = "./workers/entry.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-07-01"
send_metrics = false
keep_vars = true

[build]
command = "pnpm run build"

[ai]
binding = "AI"
# Workers AI is a remote-only binding during local development.
remote = true

# Runtime secrets (never commit values; set them with `wrangler secret put`):
#   APP_ENCRYPTION_SECRET   seals GitHub/MCP credentials (AES-256-GCM) and signs
#                           MCP server configuration. GITHUB_COOKIE_SECRET and
#                           MCP_COOKIE_SECRET are accepted as fallbacks.
# GitHub and MCP features refuse to store credentials until one of these exists.

[assets]
directory = "./build/client"
binding = "ASSETS"

# Required by `npx wrangler preview` (Worker Previews, used by Workers Builds for
# non-production branches). Intentionally empty: this Worker's Previews need no
# bindings, vars or secrets of their own beyond what is set at the top level.
[previews]
