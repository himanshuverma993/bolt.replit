name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      - name: Run type check
        run: pnpm run typecheck

      # - name: Run ESLint
      #   run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      # Node allows `new Function`/`eval`; workerd does not. This smoke test runs
      # the built Worker in local workerd and connects it to a mock MCP server
      # whose tool publishes an `outputSchema`, which is the path that used to fail
      # with "Code generation from strings disallowed for this context".
      - name: Workers runtime smoke test (MCP connect under workerd)
        run: node scripts/ci/workers-runtime-smoke.mjs
