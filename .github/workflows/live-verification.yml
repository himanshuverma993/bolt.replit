name: Live verification

# Live, read-only probes against a deployed Worker. Runs from GitHub's network,
# which can reach *.workers.dev even when a local sandbox cannot.
#
# No secrets are required or used: every request goes to a public URL and the
# Cloudflare Workers AI binding is exercised through the deployment itself.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the deployment to probe
        required: false
        default: https://bolt-replit.biharzone37.workers.dev
  push:
    branches:
      - 'arena/**'
      - 'main'

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.base_url }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          DEFAULT="https://bolt-replit.biharzone37.workers.dev"
          BASE="$INPUT_BASE_URL"

          # The value is echoed into later shell steps, so validate it strictly.
          if [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -Eq '^https?://[A-Za-z0-9._~:/?#@&=%+,-]+$'; then
            echo "::error::base_url must be an http(s) URL without shell metacharacters"
            exit 1
          fi
          if [ -z "$BASE" ]; then
            BASE="$DEFAULT"
            if [ "$REF_NAME" != "main" ]; then
              # Cloudflare Workers Builds publishes a preview deployment for the pushed
              # branch; probe it first so a branch is verified before it reaches main.
              slug=$(echo "$REF_NAME" | tr '/' '-' | tr -cd 'a-z0-9-' | cut -c1-40)
              for candidate in \
                "https://${slug}-bolt-replit.biharzone37.workers.dev" \
                "https://${slug}.biharzone37.workers.dev" \
                "https://bolt-replit-${slug}.biharzone37.workers.dev"; do
                page=$(curl -sS --max-time 15 "$candidate/" 2>/dev/null | head -c 4000 || true)
                if echo "$page" | grep -qi '<title>Bolt</title>'; then
                  BASE="$candidate"
                  echo "::notice::probing the branch preview deployment at $candidate"
                  break
                fi
              done
            fi
          fi
          if [ "$BASE" = "$DEFAULT" ]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_production=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Probing $BASE"

      - name: Home page and asset delivery
        run: |
          set -euo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' "$BASE/")
          echo "GET / -> $code"
          test "$code" = "200"
          grep -qi '<title>Bolt</title>' /tmp/home.html
          asset=$(grep -o '/assets/[^"]*\.js' /tmp/home.html | head -1)
          echo "asset: $asset"
          curl -sS -o /dev/null -w 'GET %{url_effective} -> %{http_code}\n' "$BASE$asset"

      - name: Model list exposes the Cloudflare provider and model ids
        run: |
          set -euo pipefail
          BASE="${{ steps.target.outputs.base }}"
          curl -sS "$BASE/api/models" -o /tmp/models.json
          node -e '
            const models = require("/tmp/models.json");
            const cloudflare = models.filter((m) => m.provider === "Cloudflare");
            console.log(`models=${models.length} cloudflare=${cloudflare.length}`);
            console.log(cloudflare.map((m) => m.name).join("\n"));
            if (cloudflare.length < 2) { process.exit(1); }
            if (!cloudflare.some((m) => m.name === "@cf/meta/llama-3.1-8b-instruct-fp8")) { process.exit(1); }
            if (!cloudflare.some((m) => m.name === "@cf/meta/llama-3.3-70b-instruct-fp8-fast")) { process.exit(1); }
          '

      - name: MCP status endpoint
        run: |
          set -euo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS -o /tmp/mcp.json -w '%{http_code}' "$BASE/api/mcp")
          echo "GET /api/mcp -> $code"
          cat /tmp/mcp.json
          test "$code" = "200"

      - name: GitHub status endpoint reports an unconnected, secret-aware state
        run: |
          set -euo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS -o /tmp/github.json -w '%{http_code}' "$BASE/api/github")
          echo "GET /api/github -> $code"
          cat /tmp/github.json || true
          if [ "$code" = "404" ]; then
            # Expected until this branch is deployed: the endpoint is new here.
            echo "::warning::/api/github is not part of the deployed build yet (404) - skipping content assertions"
            exit 0
          fi
          test "$code" = "200"
          grep -qi 'connected' /tmp/github.json
          if grep -qi 'gh[pousr]_' /tmp/github.json; then echo 'token-shaped value in status payload'; exit 1; fi

      - name: Real Workers AI inference through /api/chat (Cloudflare provider, env.AI.run)
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          cat > /tmp/chat.json <<'JSON'
          {
            "messages": [
              {
                "role": "user",
                "content": "[Model: @cf/meta/llama-3.1-8b-instruct-fp8]\n\n[Provider: Cloudflare]\n\nReply with exactly: LIVE_OK"
              }
            ],
            "files": {}
          }
          JSON
          code=$(curl -sS --max-time 120 -o /tmp/chat.out -w '%{http_code}' -X POST "$BASE/api/chat" \
            -H 'Content-Type: application/json' --data-binary @/tmp/chat.json) || code=000
          echo "POST /api/chat -> $code"
          head -c 200 /tmp/chat.out; echo
          if [ "$code" = "404" ] || [ "$code" = "405" ]; then
            echo "::warning::/api/chat is not served by the deployed build (HTTP $code)"
            exit 0
          fi
          fail=0
          [ "$code" = "200" ] || { echo 'FAIL: /api/chat did not return 200'; fail=1; }
          if grep -qi 'binding is unavailable' /tmp/chat.out; then
            # The branch preview is deployed from the intentionally empty [previews]
            # block in wrangler.toml, so it has no env.AI binding. What must hold there
            # is that the failure is explicit and actionable rather than a crash.
            if [ "${{ steps.target.outputs.is_production }}" = "false" ] \
              && grep -qi '\[ai\] binding' /tmp/chat.out && grep -qi 'Workers AI' /tmp/chat.out; then
              echo "::notice::preview deployment runs without the Workers AI binding (empty [previews] block); the missing-binding error is explicit and actionable"
              exit 0
            fi
            echo 'FAIL: Workers AI binding is not deployed on this Worker'
            fail=1
          fi
          grep -qi 'No API key\|API key' /tmp/chat.out && { echo 'FAIL: Cloudflare provider asked for an API key on the native env.AI path'; fail=1; }
          proceed=0
          if [ "$fail" = "0" ]; then
            # AI SDK v4 data-stream protocol: text arrives as frames of the form 0:"...".
            node -e '
              const fs = require("fs");
              const raw = fs.readFileSync("/tmp/chat.out", "utf8");
              let text = "";
              let frames = 0;
              for (const line of raw.split("\n")) {
                const i = line.indexOf(":");
                if (i < 1 || line.slice(0, i).trim() !== "0") continue;
                try {
                  const parsed = JSON.parse(line.slice(i + 1));
                  if (typeof parsed === "string") { text += parsed; frames += 1; }
                } catch {}
              }
              console.log(`text frames=${frames} chars=${text.length}`);
              fs.writeFileSync("/tmp/chat.text", text);
              if (frames < 1) { console.log("::error::no text frames (0:\"...\") in the chat data stream"); process.exit(2); }
              if (!text.toLowerCase().includes("live_ok")) {
                console.log(`::error::model output does not contain LIVE_OK :: ${text.slice(0, 300).replace(/\n/g, " ")}`);
                process.exit(3);
              }
              console.log("model output contains LIVE_OK");
            ' || { echo 'FAIL: chat data stream did not contain the requested model output'; fail=1; }
          fi
          tail=$(head -c 400 /tmp/chat.out | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g')
          if [ "$fail" = "1" ]; then
            echo "::error::Workers AI chat probe failed (HTTP $code) :: $tail"
            exit 1
          fi
          echo "::notice::Workers AI chat probe passed (HTTP $code) :: $tail"

      - name: Confirm no credential is echoed by the chat error path
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS --max-time 60 -o /tmp/badchat.out -w '%{http_code}' -X POST "$BASE/api/chat" \
            -H 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"[Model: not-a-real-model]\n\n[Provider: Nope]\n\nhi"}],"files":{}}') || code=000
          body=$(head -c 500 /tmp/badchat.out 2>/dev/null | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g')
          echo "POST /api/chat (invalid provider) -> $code :: $body"
          echo "::notice::POST /api/chat (invalid provider) -> $code :: $body"
          if grep -qiE 'sk-[A-Za-z0-9]{10,}|gh[pousr]_[A-Za-z0-9]{10,}' /tmp/badchat.out; then
            echo "::error::a credential-shaped value was returned to the client :: $body"
            exit 1
          fi
          echo 'no credential-shaped values in the error response'

      - name: Credential storage fails closed and never echoes the credential
        if: ${{ steps.target.outputs.is_production == 'false' }}
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS -o /tmp/mcp-add.json -w '%{http_code}' -X POST "$BASE/api/mcp" \
            -H 'Content-Type: application/json' \
            --data '{"action":"add","name":"fail-closed-probe","url":"https://example.com/mcp","token":"bearer-probe-do-not-store"}' \
            || echo 000)
          body=$(head -c 400 /tmp/mcp-add.json | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g')
          echo "POST /api/mcp (add + bearer, no Worker secret) -> $code :: $body"
          if grep -q 'bearer-probe-do-not-store' /tmp/mcp-add.json; then
            echo "::error::the MCP endpoint echoed the credential it was sent :: $body"
            exit 1
          fi
          if [ "$code" = "501" ]; then
            grep -q 'APP_ENCRYPTION_SECRET' /tmp/mcp-add.json || {
              echo "::error::501 without a hint naming the missing secret :: $body"
              exit 1
            }
            echo "::notice::credential storage fails closed without a Worker secret (HTTP 501) and the credential was not echoed"
          else
            echo "::warning::expected 501 (no Worker secret) but got HTTP $code; credential-echo check still passed"
          fi

      - name: Both Cloudflare model ids answer through the production deployment
        env:
          RESOLVED_BASE: ${{ steps.target.outputs.base }}
          IS_PRODUCTION: ${{ steps.target.outputs.is_production }}
        run: |
          set -uo pipefail
          # The branch preview has no Workers AI binding (empty [previews] block),
          # so the inference probe always targets the production deployment. It is
          # read-only: the model answers with a fixed string.
          if [ "$IS_PRODUCTION" = "true" ]; then
            BASE="$RESOLVED_BASE"
          else
            BASE="https://bolt-replit.biharzone37.workers.dev"
          fi
          echo "probing $BASE"
          fail=0
          for model in '@cf/meta/llama-3.1-8b-instruct-fp8' '@cf/meta/llama-3.3-70b-instruct-fp8-fast'; do
            payload=$(node -e 'process.stdout.write(JSON.stringify({messages:[{role:"user",content:`[Model: ${process.argv[1]}]\n\n[Provider: Cloudflare]\n\nReply with exactly: LIVE_OK`}],files:{}}))' "$model")
            code=$(curl -sS --max-time 120 -o /tmp/chat-model.out -w '%{http_code}' -X POST "$BASE/api/chat" \
              -H 'Content-Type: application/json' --data-binary "$payload") || code=000
            echo "POST /api/chat ($model) -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::Cloudflare model $model returned HTTP $code :: $(head -c 300 /tmp/chat-model.out | tr -d '\r' | tr '\n' '|')"
              fail=1
              continue
            fi
            node -e '
              const fs = require("fs");
              const model = process.argv[1];
              const raw = fs.readFileSync("/tmp/chat-model.out", "utf8");
              let text = "";
              for (const line of raw.split("\n")) {
                const i = line.indexOf(":");
                if (i < 1 || line.slice(0, i).trim() !== "0") continue;
                try { const parsed = JSON.parse(line.slice(i + 1)); if (typeof parsed === "string") text += parsed; } catch {}
              }
              if (!text.toLowerCase().includes("live_ok")) {
                console.log(`::error::Cloudflare model ${model} did not answer with LIVE_OK :: ${text.slice(0, 200)}`);
                process.exit(2);
              }
              console.log(`${model}: answered`);
            ' "$model" || fail=1
          done
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "::notice::both Cloudflare Workers AI model ids answered through the production deployment without an API key"

      - name: Tools-enabled chat with a real MCP server (Workers AI + MCP tool wiring)
        env:
          RESOLVED_BASE: ${{ steps.target.outputs.base }}
          IS_PRODUCTION: ${{ steps.target.outputs.is_production }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # The branch preview has no env.AI binding, so this probe always targets
          # the production deployment (like the model-id step above). Adding the
          # server only writes a cookie jar in the runner; nothing is stored on
          # the deployment. Failures are fatal only on the production target - a
          # branch run reports them as notices, because production still runs the
          # merged build, not this branch.
          if [ "$IS_PRODUCTION" = "true" ]; then
            BASE="$RESOLVED_BASE"
            STRICT=1
          else
            BASE="https://bolt-replit.biharzone37.workers.dev"
            STRICT=0
          fi
          stop() {
            if [ "$STRICT" = "1" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::notice::$1 (production is not this branch's build; the assertion activates after merge)"
            exit 0
          }
          # Deploy lag is a pipeline race, not a code defect: Workers Builds starts
          # when the push lands, so a workflow that runs immediately can still be
          # talking to the previous revision. On a production run this step waits
          # (bounded) for the served bundle to embed the pushed commit before it
          # asserts, and reports deploy lag as a warning instead of a failure - the
          # staleness step is what watches for a deployment that never catches up.
          # A branch run never waits: production will not serve that revision.
          short=$(printf '%s' "$PUSHED_SHA" | cut -c1-7)
          served=none

          read_served() {
            local homepage entry code
            homepage=$(curl -sS --max-time 30 "$BASE/" 2>/dev/null || true)
            entry=$(printf '%s' "$homepage" | grep -o '/assets/index-[^"]*\.js' | head -1 || true)
            if [ -z "$entry" ]; then
              return 1
            fi
            code=$(curl -sS --max-time 60 -o /tmp/tools-entry.js -w '%{http_code}' "$BASE$entry" || echo 000)
            [ "$code" = "200" ] || return 1
            served=$(node -e '
              const fs = require("fs");
              const s = fs.readFileSync("/tmp/tools-entry.js", "utf8");
              const set = new Set();
              for (const m of s.match(/"[0-9a-f]{7}"/g) || []) set.add(m.replace(/"/g, ""));
              console.log([...set].slice(0, 8).join(",") || "none");
            ' 2>/dev/null || echo none)
            echo ",$served," | grep -q ",$short,"
          }

          if [ "$STRICT" = "1" ]; then
            deployed=0
            attempt=1
            while [ "$attempt" -le 8 ]; do
              if read_served; then
                deployed=1
                echo "the served bundle embeds $short"
                break
              fi
              echo "attempt $attempt/8: the served bundle does not embed $short yet (markers=$served)"
              attempt=$((attempt + 1))
              if [ "$attempt" -le 8 ]; then sleep 30; fi
            done
            if [ "$deployed" != "1" ]; then
              echo "::warning::the deployment does not serve $short yet (served=$served); skipping the tools-enabled chat assertion in this run"
              echo "::notice::deploy lag, not a code defect - rerun this workflow once Workers Builds has finished"
              exit 0
            fi
          else
            echo "::notice::branch run: production serves a different revision, so the tools-enabled chat below is a best-effort signal"
          fi
          echo "probing $BASE"
          rm -f /tmp/tools.jar
          code=$(curl -sS --max-time 60 -o /tmp/mcp-tools.json -w '%{http_code}' -X POST "$BASE/api/mcp" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" -c /tmp/tools.jar \
            --data '{"action":"add","name":"cf-docs-tools","url":"https://docs.mcp.cloudflare.com/mcp"}') || code=000
          echo "POST /api/mcp (authless server for the tools chat probe) -> $code"
          if [ "$code" != "200" ]; then
            stop "the production MCP endpoint did not accept an authless server (HTTP $code)"
          fi
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/mcp-tools.json", "utf8"));
            const server = body.server || {};
            const tools = Array.isArray(server.tools) ? server.tools : [];
            if (server.status === "connected" && tools.length > 0) {
              console.log(`connected with ${tools.length} tool(s): ${tools.slice(0, 3).map((tool) => tool.name).join(", ")}`);
              fs.writeFileSync("/tmp/tools.state", "connected");
              process.exit(0);
            }
            console.log(`not connected: status=${server.status} code=${server.statusCode || "none"} message=${String(server.statusMessage || "").slice(0, 200)}`);
            fs.writeFileSync("/tmp/tools.state", "not_connected");
          '
          state=$(cat /tmp/tools.state 2>/dev/null || echo unknown)
          if [ "$state" != "connected" ]; then
            stop "the production MCP tool path is not usable from the deployed build ($state)"
          fi
          # The 8B model does not support function calling reliably - in a live run it
          # wrote the call into its text instead of emitting tool_calls - so this probe
          # uses the tool-capable model the provider already exposes
          # (@cf/meta/llama-3.3-70b-instruct-fp8-fast, "Function calling: Yes").
          payload=$(node -e 'process.stdout.write(JSON.stringify({messages:[{role:"user",content:"[Model: @cf/meta/llama-3.3-70b-instruct-fp8-fast]\n\n[Provider: Cloudflare]\n\nCall the mcp_cf-docs-tools_search_cloudflare_documentation tool with the query \"Workers AI\", then reply with exactly TOOLS_OK"}],files:{}}))')
          code=$(curl -sS --max-time 180 -o /tmp/chat-tools.out -w '%{http_code}' -X POST "$BASE/api/chat" \
            -H 'Content-Type: application/json' -b /tmp/tools.jar --data-binary "$payload") || code=000
          echo "POST /api/chat (MCP tools enabled) -> $code"
          if [ "$code" != "200" ]; then
            stop "the tools-enabled chat returned HTTP $code :: $(head -c 200 /tmp/chat-tools.out | tr -d '\r' | tr '\n' '|')"
          fi
          # Only the app's own wiring failures are fatal here. A tool *result* that
          # reports an error is judged below, where the streamed arguments are known,
          # because an empty-argument call is model behaviour - not a wiring defect.
          if grep -qiE 'MCP connection failed|MCP tools/(list|call) failed|binding is unavailable' /tmp/chat-tools.out; then
            stop "the tools-enabled chat reported an MCP or Workers AI wiring failure :: $(head -c 200 /tmp/chat-tools.out | tr -d '\r' | tr '\n' '|')"
          fi
          # The model's exact wording is reported rather than required: an 8B model
          # with a real MCP tool list may call the tool, answer in its own words or
          # write a Bolt artifact. What must hold - and what this step gates on - is
          # that production returns a well-formed AI SDK stream with content and
          # without error frames while the MCP tools are wired in.
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("/tmp/chat-tools.out", "utf8");
            let text = "";
            const frames = { text: 0, toolCall: 0, toolResult: 0, error: 0 };
            const errors = [];
            const toolArgs = [];
            const toolResults = [];
            for (const line of raw.split("\n")) {
              const i = line.indexOf(":");
              if (i < 1) continue;
              const tag = line.slice(0, i).trim();
              let parsed;
              try { parsed = JSON.parse(line.slice(i + 1)); } catch { continue; }
              if (tag === "0" && typeof parsed === "string") { text += parsed; frames.text += 1; }
              else if (tag === "9" || tag === "b") {
                frames.toolCall += 1;
                if (tag === "9" && parsed && typeof parsed === "object") {
                  toolArgs.push(JSON.stringify(parsed.args ?? null).slice(0, 200));
                }
              }
              else if (tag === "a") {
                frames.toolResult += 1;
                if (parsed && typeof parsed === "object") {
                  toolResults.push(JSON.stringify(parsed.result ?? null).slice(0, 400));
                }
              }
              else if (tag === "3") { frames.error += 1; errors.push(String(parsed).slice(0, 200)); }
            }
            fs.writeFileSync("/tmp/tools.frames.json", JSON.stringify({ frames, errors, toolArgs, toolResults }));
            fs.writeFileSync("/tmp/tools.text", text);
            console.log(`stream frames: ${JSON.stringify(frames)}`);
            console.log(`answer chars=${text.length} :: ${text.replace(/\s+/g, " ").slice(0, 160)}`);
          '
          node -e '
            const fs = require("fs");
            const { frames, errors, toolArgs, toolResults } = JSON.parse(fs.readFileSync("/tmp/tools.frames.json", "utf8"));
            const sampleArgs = (toolArgs || []).find((args) => args && args !== "null" && args !== "{}");
            const resultText = (toolResults || [])[0] || "";
            const note = `text=${frames.text} toolCall=${frames.toolCall} toolResult=${frames.toolResult}` +
              (sampleArgs ? ` args=${sampleArgs}` : "") +
              (resultText ? ` result=${resultText}` : "");
            if (frames.error > 0) {
              fs.writeFileSync("/tmp/tools.state", "error_frame");
              console.log(`stream error frame: ${errors.join(" | ")}`);
              process.exit(0);
            }
            if (frames.text === 0 && frames.toolCall === 0) {
              fs.writeFileSync("/tmp/tools.state", "empty_stream");
              process.exit(0);
            }
            // A remote call that never completed (transport, auth, timeout) means the
            // MCP wiring or its credentials are broken - that stays fatal. A tool that
            // answered with an error is a tool-level outcome and is reported, with the
            // arguments that were sent, so a human can tell model behaviour from wiring.
            if (/MCP tool .* failed on /.test(resultText)) {
              fs.writeFileSync("/tmp/tools.state", "tool_failure");
              console.log(`the MCP call itself failed :: ${note}`);
              process.exit(0);
            }
            if (/MCP tool .* returned an error|was NOT executed|is not in the discovered tool list/.test(resultText)) {
              console.log(`::warning::the MCP tool answered with an error (tool-level, not a wiring failure) :: ${note}`);
            }
            fs.writeFileSync("/tmp/tools.state", "ok");
            const text = fs.readFileSync("/tmp/tools.text", "utf8");
            if (sampleArgs) {
              console.log(`::notice::production streamed a tool call with arguments (${note})`);
            }
            if (frames.toolResult > 0) {
              console.log(`::notice::production executed an MCP tool inside a Workers AI chat (${note})`);
            }
            if (text.toLowerCase().includes("tools_ok")) {
              console.log(`::notice::the tools-enabled chat answered TOOLS_OK, so the MCP tool list reached the model (${note})`);
            } else {
              console.log(`::warning::the model did not answer TOOLS_OK; the stream is still well formed (${note}) :: ${text.replace(/\s+/g, " ").slice(0, 160)}`);
            }
          '
          state=$(cat /tmp/tools.state 2>/dev/null || echo unknown)
          if [ "$state" = "error_frame" ] || [ "$state" = "empty_stream" ] || [ "$state" = "tool_failure" ]; then
            stop "the tools-enabled chat produced $state (see the frames line above)"
          fi
          echo "::notice::production runs a tools-enabled chat with a real remote MCP server and Workers AI (${state})"

      - name: Deployed bundle embeds the deployed commit (staleness check)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PUSHED_SHA: ${{ github.sha }}
          IS_PRODUCTION: ${{ steps.target.outputs.is_production }}
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          if [ "$IS_PRODUCTION" = "true" ]; then
            expected="main tip"
            main_short=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/commits/main" \
              | node -e 'let d="";process.stdin.on("data",(c)=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).sha.slice(0,7))}catch{console.log("unknown")}})') || main_short=unknown
          else
            # No checkout step runs here; the pushed revision is on the event payload.
            expected="pushed commit"
            main_short=$(echo "$PUSHED_SHA" | cut -c1-7)
          fi
          echo "expected ($expected): $main_short"
          markers=none
          entry=none
          attempt=1
          max_attempts=8
          while [ "$attempt" -le "$max_attempts" ]; do
            # Re-read the HTML every attempt: a deployment replaces the hashed asset
            # name, so a cached name from an earlier step can legitimately 404.
            homepage=$(curl -sS --max-time 30 "$BASE/" 2>/dev/null || true)
            entry=$(printf '%s' "$homepage" | grep -o '/assets/index-[^"]*\.js' | head -1 || true)
            if [ -z "$entry" ]; then
              echo "attempt $attempt/$max_attempts: no entry asset in the served HTML"
            else
              code=$(curl -sS --max-time 60 -o /tmp/entry.js -w '%{http_code}' "$BASE$entry" || echo 000)
              markers=$(node -e '
                const fs = require("fs");
                const s = fs.readFileSync("/tmp/entry.js", "utf8");
                const set = new Set();
                for (const m of s.match(/"[0-9a-f]{7}"/g) || []) set.add(m.replace(/"/g, ""));
                console.log([...set].slice(0, 8).join(",") || "none");
              ' 2>/dev/null || echo none)
              echo "attempt $attempt/$max_attempts: $entry -> HTTP $code, markers=$markers"
              if [ "$code" = "200" ] && echo ",$markers," | grep -q ",$main_short,"; then
                echo "::notice::live bundle embeds $main_short, the current $expected - the deployment is built from that revision"
                exit 0
              fi
            fi
            # A branch preview build starts with the push: give it a few minutes.
            # Production lag is a real signal, so do not wait for it.
            if [ "$expected" = "main tip" ]; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 30
          done
          echo "::warning::live bundle does not embed the current $expected ($main_short); entry=$entry markers=$markers (a build may still be in flight)"

      - name: GitHub endpoint rejects cross-origin, malformed and unauthenticated requests
        if: ${{ steps.target.outputs.is_production == 'false' }}
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          # Cross-origin POST must be refused before anything else happens.
          code=$(curl -sS -o /tmp/gh-csrf.json -w '%{http_code}' -X POST "$BASE/api/github" \
            -H 'Content-Type: application/json' -H 'Origin: https://evil.example.test' \
            --data '{"action":"connect","token":"ghp_crossorigin_probe_do_not_store"}') || code=000
          echo "POST /api/github (cross-origin) -> $code"
          [ "$code" = "403" ] || { echo "::error::cross-origin GitHub POST was not rejected (HTTP $code)"; exit 1; }
          # Malformed body must be a clear 400, not a crash.
          code=$(curl -sS -o /tmp/gh-bad.json -w '%{http_code}' -X POST "$BASE/api/github" \
            -H 'Content-Type: application/json' --data 'not json') || code=000
          echo "POST /api/github (malformed body) -> $code"
          [ "$code" = "400" ] || { echo "::error::malformed GitHub body was not rejected with 400 (HTTP $code)"; exit 1; }
          # Without a Worker secret the endpoint must fail closed and never echo the token.
          code=$(curl -sS -o /tmp/gh-connect.json -w '%{http_code}' -X POST "$BASE/api/github" \
            -H 'Content-Type: application/json' \
            --data '{"action":"connect","token":"ghp_connect_probe_do_not_store"}') || code=000
          echo "POST /api/github (connect without Worker secret) -> $code"
          if grep -q 'ghp_connect_probe_do_not_store' /tmp/gh-connect.json; then
            echo "::error::/api/github echoed the token it was sent"
            exit 1
          fi
          if [ "$code" = "501" ]; then
            grep -q 'APP_ENCRYPTION_SECRET' /tmp/gh-connect.json || {
              echo "::error::501 without a hint naming the missing secret"
              exit 1
            }
            echo "::notice::GitHub token storage fails closed without a Worker secret (HTTP 501) and the token was not echoed"
          else
            echo "::warning::expected 501 from /api/github connect (no Worker secret) but got HTTP $code"
          fi
          # Reads must still work and must stay free of credential-shaped values.
          code=$(curl -sS -o /tmp/gh-status.json -w '%{http_code}' "$BASE/api/github") || code=000
          echo "GET /api/github -> $code"
          [ "$code" = "200" ] || { echo "::error::GET /api/github returned HTTP $code"; exit 1; }
          if grep -qiE 'gh[pousr]_[A-Za-z0-9]{10,}|Bearer [A-Za-z0-9._-]{20,}' /tmp/gh-status.json; then
            echo "::error::/api/github status exposes a credential-shaped value"
            exit 1
          fi

      - name: MCP rejects insecure URLs and classifies a real remote server honestly
        if: ${{ steps.target.outputs.is_production == 'false' }}
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          # Plain http must be refused before any network call.
          code=$(curl -sS -o /tmp/mcp-http.json -w '%{http_code}' -X POST "$BASE/api/mcp" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" \
            --data '{"action":"add","name":"insecure-probe","url":"http://example.com/mcp"}') || code=000
          echo "POST /api/mcp (plain http url) -> $code"
          [ "$code" = "400" ] || { echo "::error::an insecure http MCP url was accepted (HTTP $code)"; exit 1; }
          # A real, publicly reachable MCP server: either its tools are discovered
          # or the refusal is classified. A silent \"connected with no tools\" is a failure.
          code=$(curl -sS --max-time 60 -o /tmp/mcp-docs.json -w '%{http_code}' -X POST "$BASE/api/mcp" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" -c /tmp/mcp.jar \
            --data '{"action":"add","name":"cloudflare-docs","url":"https://docs.mcp.cloudflare.com/mcp"}') || code=000
          echo "POST /api/mcp (real remote server) -> $code :: $(head -c 300 /tmp/mcp-docs.json | tr -d '\r' | tr '\n' '|')"
          [ "$code" = "200" ] || { echo "::error::adding a real remote MCP server returned HTTP $code"; exit 1; }
          if grep -qiE 'access_token|refresh_token|"token"' /tmp/mcp-docs.json; then
            echo "::error::the MCP response exposed token material"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/mcp-docs.json", "utf8"));
            const server = body.server || {};
            const tools = Array.isArray(server.tools) ? server.tools.length : 0;
            if (server.status === "connected") {
              if (tools < 1) {
                console.log("::error::a remote MCP server was reported connected without any discovered tools");
                process.exit(2);
              }
              console.log(`::notice::real remote MCP server connected with ${tools} discovered tool(s): ${server.tools.map((t) => t.name).slice(0, 5).join(", ")}`);
              process.exit(0);
            }
            const detail = `${server.statusCode || "missing"} :: ${String(server.statusMessage || "").slice(0, 200)}`;
            if (!server.statusCode) {
              console.log(`::error::remote MCP failure has no classification :: ${JSON.stringify(server).slice(0, 300)}`);
              process.exit(3);
            }
            if (server.statusCode === "unknown") {
              console.log(`::warning::the remote MCP failure was only classified as unknown :: ${detail}`);
              process.exit(0);
            }
            console.log(`::warning::the remote MCP server refused anonymous access; classified as ${detail}`);
          '

          # Cloudflare's own MCP server requires OAuth. It must never be reported
          # as connected when no credentials were supplied, and the refusal must
          # carry a classification instead of a bare "unknown".
          code=$(curl -sS --max-time 60 -o /tmp/mcp-cf.json -w '%{http_code}' -X POST "$BASE/api/mcp" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" -c /tmp/mcp-cf.jar \
            --data '{"action":"add","name":"cloudflare-oauth","url":"https://mcp.cloudflare.com/mcp"}') || code=000
          echo "POST /api/mcp (oauth-only server) -> $code :: $(head -c 300 /tmp/mcp-cf.json | tr -d '\r' | tr '\n' '|')"
          [ "$code" = "200" ] || { echo "::error::an OAuth-only MCP server returned HTTP $code"; exit 1; }
          if grep -qiE 'access_token|refresh_token|"token"' /tmp/mcp-cf.json; then
            echo "::error::the OAuth-only MCP response exposed token material"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/mcp-cf.json", "utf8"));
            const server = body.server || {};
            const classified = ["http_401", "http_403", "oauth_required", "invalid_bearer_token", "protocol_negotiation_failed", "tools_list_failed", "network", "dns", "tls"];
            if (server.status === "connected") {
              console.log(`::error::an OAuth-only MCP server was reported connected without credentials (tools: ${(server.tools || []).length})`);
              process.exit(2);
            }
            if (server.status !== "auth_required" && server.status !== "error") {
              console.log(`::error::unexpected status for an OAuth-only MCP server :: ${server.status}`);
              process.exit(3);
            }
            if (!server.statusCode || server.statusCode === "unknown") {
              console.log(`::error::the OAuth-only MCP refusal was not classified :: ${JSON.stringify({ status: server.status, statusCode: server.statusCode, statusMessage: server.statusMessage }).slice(0, 300)}`);
              process.exit(4);
            }
            if (!classified.includes(server.statusCode)) {
              console.log(`::warning::the OAuth-only MCP server refused with an unexpected classification :: ${server.statusCode} :: ${String(server.statusMessage || "").slice(0, 200)}`);
              process.exit(0);
            }
            console.log(`::notice::the OAuth-only MCP server was refused and classified as ${server.status} / ${server.statusCode}`);
          '

      - name: MCP OAuth callback rejects a forged redirect without contacting the authorization server
        if: ${{ steps.target.outputs.is_production == 'false' }}
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' \
            "$BASE/api/mcp/oauth/callback?code=attacker-code&state=attacker-state") || location=""
          echo "GET /api/mcp/oauth/callback (forged, no state cookie) -> $location"
          case "$location" in
            *'mcp_oauth=error'*'reason=missing_state_cookie'*) echo "::notice::forged MCP OAuth callback rejected with reason=missing_state_cookie" ;;
            *) echo "::error::forged MCP OAuth callback was not rejected safely :: $location"; exit 1 ;;
          esac
          if printf '%s' "$location" | grep -qiE 'access_token|refresh_token|code=attacker-code'; then
            echo "::error::the OAuth callback reflected credentials or the attacker code into the redirect"
            exit 1
          fi
          metadata=$(curl -sS -o /tmp/mcp-client-metadata.json -w '%{http_code}' "$BASE/api/mcp/oauth/client-metadata") || metadata=000
          echo "GET /api/mcp/oauth/client-metadata -> $metadata"
          [ "$metadata" = "200" ] || { echo "::error::OAuth client metadata is not served (HTTP $metadata)"; exit 1; }
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/mcp-client-metadata.json", "utf8"));
            if (body.token_endpoint_auth_method !== "none") { console.log("::error::client metadata advertises a confidential client"); process.exit(2); }
            if (!Array.isArray(body.redirect_uris) || !body.redirect_uris.some((u) => u.endsWith("/api/mcp/oauth/callback"))) {
              console.log("::error::client metadata has no callback redirect uri"); process.exit(3);
            }
            if (body.client_secret) { console.log("::error::client metadata exposes a client secret"); process.exit(4); }
            console.log(`::notice::OAuth client metadata served for ${body.client_id}`);
          '


      - name: GitHub and Cloudflare MCP hosts from GitHub's network
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          node <<'NODE'
          const hosts = [
            { id: 'cf-docs', url: 'https://docs.mcp.cloudflare.com/mcp', expect: 'initialize-ok' },
            { id: 'cf-oauth', url: 'https://mcp.cloudflare.com/mcp', expect: 'auth' },
            { id: 'github-default', url: 'https://api.githubcopilot.com/mcp/', expect: 'auth' },
            { id: 'github-all', url: 'https://api.githubcopilot.com/mcp/x/all', expect: 'auth' },
            { id: 'github-repos', url: 'https://api.githubcopilot.com/mcp/x/repos', expect: 'auth' },
          ];
          const payload = JSON.stringify({
            jsonrpc: '2.0',
            id: 1,
            method: 'initialize',
            params: {
              protocolVersion: '2025-03-26',
              capabilities: {},
              clientInfo: { name: 'bolt-live-probe', version: '0.0.3' },
            },
          });
          function redact(value) {
            return String(value)
              .replace(/\b(gh[pousr]_[A-Za-z0-9_-]{10,})/g, '[redacted]')
              .replace(/\b(github_pat_[A-Za-z0-9_-]{10,})/g, '[redacted]')
              .replace(/Bearer\s+[^\s]+/gi, 'Bearer [redacted]');
          }
          async function probe(url, extraHeaders = {}) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 20000);
            try {
              const response = await fetch(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Accept: 'application/json, text/event-stream',
                  ...extraHeaders,
                },
                body: payload,
                signal: controller.signal,
              });
              const body = redact(await response.text()).replace(/\s+/g, ' ').slice(0, 280);
              return { status: response.status, body, www: response.headers.get('www-authenticate') || 'none' };
            } catch (error) {
              return { status: 0, body: redact(error instanceof Error ? error.message : String(error)).slice(0, 280), www: 'none' };
            } finally {
              clearTimeout(timer);
            }
          }
          function initializeOk(result) {
            return result.status === 200 && /initialize|protocolVersion|serverInfo|"result"/i.test(result.body);
          }
          function authChallenge(result) {
            return result.status === 401 || result.status === 403 || /unauthori|unauthorized|forbidden|oauth/i.test(result.body);
          }
          (async () => {
            let failed = 0;
            for (const host of hosts) {
              const result = await probe(host.url);
              console.log(`${host.id} ${host.url} -> HTTP ${result.status} www=${result.www} :: ${result.body}`);
              if (host.expect === 'initialize-ok') {
                if (!initializeOk(result)) {
                  console.log(`::error::${host.id} did not initialize (HTTP ${result.status})`);
                  failed += 1;
                } else {
                  console.log(`::notice::${host.id} initialize succeeded`);
                }
              } else if (initializeOk(result)) {
                console.log(`::notice::${host.id} initialize succeeded without credentials`);
              } else if (authChallenge(result)) {
                console.log(`::notice::${host.id} reachable and requires auth (HTTP ${result.status})`);
              } else {
                console.log(`::error::${host.id} unreachable or unclassified (HTTP ${result.status}) :: ${result.body}`);
                failed += 1;
              }
            }
            const token = process.env.GH_TOKEN;
            if (token) {
              const authed = await probe('https://api.githubcopilot.com/mcp/', { Authorization: `Bearer ${token}` });
              if (initializeOk(authed)) {
                console.log(`::notice::GitHub Actions token was accepted by GitHub remote MCP (HTTP ${authed.status})`);
              } else {
                console.log(`::notice::GitHub Actions token was not accepted by GitHub remote MCP (HTTP ${authed.status}); a user PAT is required. This is expected.`);
              }
            }
            if (failed) process.exit(1);
          })().catch((error) => {
            console.log(`::error::MCP host probe crashed :: ${redact(error instanceof Error ? error.message : String(error))}`);
            process.exit(1);
          });
          NODE

      - name: Worker classifies GitHub remote MCP as PAT/bearer, never silent-connected
        if: ${{ steps.target.outputs.is_production == 'false' }}
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS --max-time 60 -o /tmp/mcp-github.json -w '%{http_code}' -X POST "$BASE/api/mcp" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" -c /tmp/mcp-github.jar \
            --data '{"action":"add","name":"github-live","url":"https://api.githubcopilot.com/mcp/"}') || code=000
          echo "POST /api/mcp (GitHub remote, no PAT) -> $code :: $(head -c 400 /tmp/mcp-github.json | tr -d '\r' | tr '\n' '|')"
          [ "$code" = "200" ] || { echo "::error::adding GitHub remote MCP returned HTTP $code"; exit 1; }
          if grep -qiE 'access_token|refresh_token|"token"|gh[pousr]_|github_pat_' /tmp/mcp-github.json; then
            echo "::error::the GitHub MCP response exposed token material"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/mcp-github.json", "utf8"));
            const server = body.server || {};
            const tools = Array.isArray(server.tools) ? server.tools.length : 0;
            const note = `status=${server.status} authMode=${server.authMode} code=${server.statusCode || "none"} tools=${tools} :: ${String(server.statusMessage || "").slice(0, 180)}`;
            if (server.status === "connected") {
              if (tools < 1) {
                console.log("::error::GitHub MCP was reported connected without discovered tools (the original cookie/catalog bug)");
                process.exit(2);
              }
              console.log(`::warning::GitHub MCP connected without a PAT (${note}) — unexpected; treating as Unverified success`);
              process.exit(0);
            }
            if (server.authMode === "oauth") {
              console.log(`::error::GitHub remote MCP was classified as OAuth; PAT-first path is required :: ${note}`);
              process.exit(3);
            }
            if (server.status !== "auth_required" && server.status !== "error") {
              console.log(`::error::unexpected GitHub MCP status :: ${note}`);
              process.exit(4);
            }
            if (!server.statusCode || server.statusCode === "unknown") {
              console.log(`::error::GitHub MCP refusal was not classified :: ${note}`);
              process.exit(5);
            }
            console.log(`::notice::GitHub remote MCP was refused without a PAT and stayed on the bearer path (${note})`);
          '
