name: Live verification

# Live, read-only probes against a deployed Worker. Runs from GitHub's network,
# which can reach *.workers.dev even when a local sandbox cannot.
#
# No secrets are required or used: every request goes to a public URL and the
# Cloudflare Workers AI binding is exercised through the deployment itself.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the deployment to probe
        required: false
        default: https://bolt-replit.biharzone37.workers.dev
  push:
    branches:
      - 'arena/**'
      - 'main'

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.base_url }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          DEFAULT="https://bolt-replit.biharzone37.workers.dev"
          BASE="$INPUT_BASE_URL"

          # The value is echoed into later shell steps, so validate it strictly.
          if [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -Eq '^https?://[A-Za-z0-9._~:/?#@&=%+,-]+$'; then
            echo "::error::base_url must be an http(s) URL without shell metacharacters"
            exit 1
          fi
          if [ -z "$BASE" ]; then
            BASE="$DEFAULT"
            if [ "$REF_NAME" != "main" ]; then
              # Cloudflare Workers Builds publishes a preview deployment for the pushed
              # branch; probe it first so a branch is verified before it reaches main.
              slug=$(echo "$REF_NAME" | tr '/' '-' | tr -cd 'a-z0-9-' | cut -c1-40)
              for candidate in \
                "https://${slug}-bolt-replit.biharzone37.workers.dev" \
                "https://${slug}.biharzone37.workers.dev" \
                "https://bolt-replit-${slug}.biharzone37.workers.dev"; do
                page=$(curl -sS --max-time 15 "$candidate/" 2>/dev/null | head -c 4000 || true)
                if echo "$page" | grep -qi '<title>Bolt</title>'; then
                  BASE="$candidate"
                  echo "::notice::probing the branch preview deployment at $candidate"
                  break
                fi
              done
            fi
          fi
          if [ "$BASE" = "$DEFAULT" ]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_production=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Probing $BASE"

      - name: Home page and asset delivery
        run: |
          set -euo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' "$BASE/")
          echo "GET / -> $code"
          test "$code" = "200"
          grep -qi '<title>Bolt</title>' /tmp/home.html
          asset=$(grep -o '/assets/[^"]*\.js' /tmp/home.html | head -1)
          echo "asset: $asset"
          curl -sS -o /dev/null -w 'GET %{url_effective} -> %{http_code}\n' "$BASE$asset"

      - name: Model list exposes the Cloudflare provider and model ids
        run: |
          set -euo pipefail
          BASE="${{ steps.target.outputs.base }}"
          curl -sS "$BASE/api/models" -o /tmp/models.json
          node -e '
            const models = require("/tmp/models.json");
            const cloudflare = models.filter((m) => m.provider === "Cloudflare");
            console.log(`models=${models.length} cloudflare=${cloudflare.length}`);
            console.log(cloudflare.map((m) => m.name).join("\n"));
            if (cloudflare.length < 2) { process.exit(1); }
            if (!cloudflare.some((m) => m.name === "@cf/meta/llama-3.1-8b-instruct-fp8")) { process.exit(1); }
            if (!cloudflare.some((m) => m.name === "@cf/meta/llama-3.3-70b-instruct-fp8-fast")) { process.exit(1); }
          '

      - name: MCP status endpoint
        run: |
          set -euo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS -o /tmp/mcp.json -w '%{http_code}' "$BASE/api/mcp")
          echo "GET /api/mcp -> $code"
          cat /tmp/mcp.json
          test "$code" = "200"

      - name: GitHub status endpoint reports an unconnected, secret-aware state
        run: |
          set -euo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS -o /tmp/github.json -w '%{http_code}' "$BASE/api/github")
          echo "GET /api/github -> $code"
          cat /tmp/github.json || true
          if [ "$code" = "404" ]; then
            # Expected until this branch is deployed: the endpoint is new here.
            echo "::warning::/api/github is not part of the deployed build yet (404) - skipping content assertions"
            exit 0
          fi
          test "$code" = "200"
          grep -qi 'connected' /tmp/github.json
          if grep -qi 'gh[pousr]_' /tmp/github.json; then echo 'token-shaped value in status payload'; exit 1; fi

      - name: Real Workers AI inference through /api/chat (Cloudflare provider, env.AI.run)
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          cat > /tmp/chat.json <<'JSON'
          {
            "messages": [
              {
                "role": "user",
                "content": "[Model: @cf/meta/llama-3.1-8b-instruct-fp8]\n\n[Provider: Cloudflare]\n\nReply with exactly: LIVE_OK"
              }
            ],
            "files": {}
          }
          JSON
          code=$(curl -sS --max-time 120 -o /tmp/chat.out -w '%{http_code}' -X POST "$BASE/api/chat" \
            -H 'Content-Type: application/json' --data-binary @/tmp/chat.json) || code=000
          echo "POST /api/chat -> $code"
          head -c 200 /tmp/chat.out; echo
          if [ "$code" = "404" ] || [ "$code" = "405" ]; then
            echo "::warning::/api/chat is not served by the deployed build (HTTP $code)"
            exit 0
          fi
          fail=0
          [ "$code" = "200" ] || { echo 'FAIL: /api/chat did not return 200'; fail=1; }
          if grep -qi 'binding is unavailable' /tmp/chat.out; then
            # The branch preview is deployed from the intentionally empty [previews]
            # block in wrangler.toml, so it has no env.AI binding. What must hold there
            # is that the failure is explicit and actionable rather than a crash.
            if [ "${{ steps.target.outputs.is_production }}" = "false" ] \
              && grep -qi '\[ai\] binding' /tmp/chat.out && grep -qi 'Workers AI' /tmp/chat.out; then
              echo "::notice::preview deployment runs without the Workers AI binding (empty [previews] block); the missing-binding error is explicit and actionable"
              exit 0
            fi
            echo 'FAIL: Workers AI binding is not deployed on this Worker'
            fail=1
          fi
          grep -qi 'No API key\|API key' /tmp/chat.out && { echo 'FAIL: Cloudflare provider asked for an API key on the native env.AI path'; fail=1; }
          proceed=0
          if [ "$fail" = "0" ]; then
            # AI SDK v4 data-stream protocol: text arrives as frames of the form 0:"...".
            node -e '
              const fs = require("fs");
              const raw = fs.readFileSync("/tmp/chat.out", "utf8");
              let text = "";
              let frames = 0;
              for (const line of raw.split("\n")) {
                const i = line.indexOf(":");
                if (i < 1 || line.slice(0, i).trim() !== "0") continue;
                try {
                  const parsed = JSON.parse(line.slice(i + 1));
                  if (typeof parsed === "string") { text += parsed; frames += 1; }
                } catch {}
              }
              console.log(`text frames=${frames} chars=${text.length}`);
              fs.writeFileSync("/tmp/chat.text", text);
              if (frames < 1) { console.log("::error::no text frames (0:\"...\") in the chat data stream"); process.exit(2); }
              if (!text.toLowerCase().includes("live_ok")) {
                console.log(`::error::model output does not contain LIVE_OK :: ${text.slice(0, 300).replace(/\n/g, " ")}`);
                process.exit(3);
              }
              console.log("model output contains LIVE_OK");
            ' || { echo 'FAIL: chat data stream did not contain the requested model output'; fail=1; }
          fi
          tail=$(head -c 400 /tmp/chat.out | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g')
          if [ "$fail" = "1" ]; then
            echo "::error::Workers AI chat probe failed (HTTP $code) :: $tail"
            exit 1
          fi
          echo "::notice::Workers AI chat probe passed (HTTP $code) :: $tail"

      - name: Confirm no credential is echoed by the chat error path
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS --max-time 60 -o /tmp/badchat.out -w '%{http_code}' -X POST "$BASE/api/chat" \
            -H 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"[Model: not-a-real-model]\n\n[Provider: Nope]\n\nhi"}],"files":{}}') || code=000
          body=$(head -c 500 /tmp/badchat.out 2>/dev/null | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g')
          echo "POST /api/chat (invalid provider) -> $code :: $body"
          echo "::notice::POST /api/chat (invalid provider) -> $code :: $body"
          if grep -qiE 'sk-[A-Za-z0-9]{10,}|gh[pousr]_[A-Za-z0-9]{10,}' /tmp/badchat.out; then
            echo "::error::a credential-shaped value was returned to the client :: $body"
            exit 1
          fi
          echo 'no credential-shaped values in the error response'

      - name: Credential storage fails closed and never echoes the credential
        if: ${{ steps.target.outputs.is_production == 'false' }}
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          code=$(curl -sS -o /tmp/mcp-add.json -w '%{http_code}' -X POST "$BASE/api/mcp" \
            -H 'Content-Type: application/json' \
            --data '{"action":"add","name":"fail-closed-probe","url":"https://example.com/mcp","token":"bearer-probe-do-not-store"}' \
            || echo 000)
          body=$(head -c 400 /tmp/mcp-add.json | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g')
          echo "POST /api/mcp (add + bearer, no Worker secret) -> $code :: $body"
          if grep -q 'bearer-probe-do-not-store' /tmp/mcp-add.json; then
            echo "::error::the MCP endpoint echoed the credential it was sent :: $body"
            exit 1
          fi
          if [ "$code" = "501" ]; then
            grep -q 'APP_ENCRYPTION_SECRET' /tmp/mcp-add.json || {
              echo "::error::501 without a hint naming the missing secret :: $body"
              exit 1
            }
            echo "::notice::credential storage fails closed without a Worker secret (HTTP 501) and the credential was not echoed"
          else
            echo "::warning::expected 501 (no Worker secret) but got HTTP $code; credential-echo check still passed"
          fi

      - name: Deployed bundle embeds the deployed commit (staleness check)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PUSHED_SHA: ${{ github.sha }}
          IS_PRODUCTION: ${{ steps.target.outputs.is_production }}
        run: |
          set -uo pipefail
          BASE="${{ steps.target.outputs.base }}"
          entry=$(grep -o '/assets/index-[^"]*\.js' /tmp/home.html 2>/dev/null | head -1 || true)
          echo "entry asset: ${entry:-none}"
          if [ -z "$entry" ]; then
            echo "::warning::no index-*.js entry asset in the served HTML; skipping the staleness check"
            exit 0
          fi
          if [ "$IS_PRODUCTION" = "true" ]; then
            expected="main tip"
            main_short=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/commits/main" \
              | node -e 'let d="";process.stdin.on("data",(c)=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).sha.slice(0,7))}catch{console.log("unknown")}})') || main_short=unknown
          else
            # No checkout step runs here; the pushed revision is on the event payload.
            expected="pushed commit"
            main_short=$(echo "$PUSHED_SHA" | cut -c1-7)
          fi
          extract_markers() {
            node -e '
              const fs = require("fs");
              const s = fs.readFileSync("/tmp/entry.js", "utf8");
              const set = new Set();
              for (const m of s.match(/"[0-9a-f]{7}"/g) || []) set.add(m.replace(/"/g, ""));
              console.log([...set].slice(0, 8).join(",") || "none");
            ' 2>/dev/null || echo none
          }
          echo "expected ($expected): $main_short"
          markers=none
          attempt=1
          max_attempts=8
          while [ "$attempt" -le "$max_attempts" ]; do
            code=$(curl -sS --max-time 60 -o /tmp/entry.js -w '%{http_code}' "$BASE$entry" || echo 000)
            markers=$(extract_markers)
            echo "attempt $attempt/$max_attempts: GET $entry -> $code, markers=$markers"
            if [ "$code" = "200" ] && echo ",$markers," | grep -q ",$main_short,"; then
              echo "::notice::live bundle embeds $main_short, the current $expected - the deployment is built from that revision"
              exit 0
            fi
            # A branch preview build starts with the push: give it a few minutes.
            # Production lag is a real signal, so do not wait for it.
            if [ "$expected" = "main tip" ]; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 30
          done
          if [ "$markers" = "none" ]; then
            echo "::warning::could not read the entry bundle (HTTP ${code:-000}); skipping the staleness check"
            exit 0
          fi
          echo "::warning::live bundle does not embed the current $expected ($main_short); markers=$markers (a build may still be in flight)"
